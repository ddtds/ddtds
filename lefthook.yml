pre-commit:
  jobs:
    - name: format
      run: pnpm run format {staged_files}
      stage_fixed: true
    - name: renovate-config
      glob: "renovate.json"
      run: pnpm run validate:renovate

pre-push:
  parallel: true
  jobs:
    - name: lint
      run: pnpm run lint
    - name: sherif
      run: pnpm run sherif
    - name: knip
      run: pnpm run knip
    - name: typecheck
      run: pnpm run typecheck
    - name: test
      run: pnpm run test
