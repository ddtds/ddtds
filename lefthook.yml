pre-commit:
  jobs:
    - name: format
      run: pnpm run format {staged_files}
      stage_fixed: true
    - name: renovate-config
      glob: "renovate.json"
      run: pnpm run validate:renovate

pre-push:
  # build once, then check in parallel; checks that load packages use the build
  piped: true
  jobs:
    - name: build
      run: pnpm run build
    - group:
        parallel: true
        jobs:
          - name: lint
            run: pnpm run lint
          - name: sherif
            run: pnpm run sherif
          - name: knip
            run: pnpm run knip
          - name: typecheck
            run: pnpm run typecheck
          - name: publint
            run: pnpm run publint
          - name: attw
            run: pnpm run attw
          # not `pnpm test`, whose pretest would rebuild while other checks read dist
          - name: test
            run: pnpm exec vitest run
