packages:
  - "packages/*"
  - "examples/*"

allowBuilds:
  core-js-pure: true
  dtrace-provider: true
  esbuild: true
  lefthook: true
  protobufjs: true
  re2: true

catalogs:
  dev:
    "@types/node": ^24.19.2
    typescript: ^7.0.2
    vitest: ^4.1.11
  prod: {}
  peer: {}

# pnpm defaults minimumReleaseAge to 1440 (24h) since v11, even with zero
# config, which blocks plain `pnpm install` on anything with a fast-moving
# transitive tree (e.g. renovate's @aws-sdk/* deps release several times a
# day). Disable it instead of pinning/excluding packages around it.
minimumReleaseAge: 0
