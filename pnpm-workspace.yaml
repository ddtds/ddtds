packages:
  - "packages/*"
  - "benches"
  - "test-utils"
  - "examples/*/*"
  - "examples/vitest/monorepo/packages/*"

allowBuilds:
  # no-op/warning-only postinstall scripts, nothing to build
  core-js-pure: false
  dtrace-provider: false
  protobufjs: false
  # optional native regex binding for renovate; falls back to RegExp fine
  re2: false
  # actually need these: esbuild downloads its binary, lefthook syncs git hooks
  esbuild: true
  lefthook: true

catalogs:
  dev:
    "@jridgewell/trace-mapping": ^0.3.31
    "@logtape/lint": 2.4.0
    "@logtape/testing": 2.4.0
    "@tsrx/oxc": 0.20.0
    "@types/node": 24.19.1
    "@types/stack-utils": ^2.0.3
    stack-utils: ^2.0.6
    typescript: ^7.0.2
    vitest: ^5.0.3
    "@vitest/coverage-v8": ^5.0.3
  examples:
    "@angular/compiler": ^22.2.1
    "@angular/core": ^22.2.1
    "@angular/platform-browser": ^22.2.1
    "@angular/router": ^22.2.1
    "@oxc-project/runtime": ^0.153.0
    "@preact/preset-vite": ^2.10.6
    "@solidjs/testing-library": ^0.8.10
    "@sveltejs/vite-plugin-svelte": ^7.3.1
    "@testing-library/angular": ^19.5.0
    "@testing-library/dom": ^10.4.2
    "@testing-library/jest-dom": ^7.0.1
    "@testing-library/preact": ^3.2.4
    "@testing-library/react": ^16.3.3
    "@testing-library/svelte": ^5.4.2
    "@testing-library/user-event": ^14.6.7
    "@testing-library/vue": ^8.1.0
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    "@vitejs/plugin-react": ^6.1.2
    "@vitejs/plugin-vue": ^6.0.9
    happy-dom: 20.14.6
    lit: ^3.3.3
    octane: ^0.10.0
    preact: ^11.0.0
    react: ^19.3.0
    react-dom: ^19.3.0
    rxjs: ^7.8.2
    shadow-dom-testing-library: ^1.14.2
    solid-js: ^1.9.16
    svelte: ^5.57.2
    vite-plugin-solid: ^2.11.14
    vue: ^3.5.43
  prod:
    "@logtape/logtape": ^2.4.0
  peer: {}

minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  # todo: remove 10/16/2026
  - "@codspeed/vitest-plugin"
  - "@codspeed/core"
