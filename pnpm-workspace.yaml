packages:
  - "packages/*"
  - "benches"
  - "test-utils"
  - "examples/*/*"
  - "examples/vitest/monorepo/packages/*"

allowBuilds:
  # no-op/warning-only postinstall scripts, nothing to build
  core-js-pure: false
  dtrace-provider: false
  protobufjs: false
  # optional native regex binding for renovate; falls back to RegExp fine
  re2: false
  # optional native perf addons pulled in by @angular/build, fall back to JS
  "@parcel/watcher": false
  lmdb: false
  msgpackr-extract: false
  # actually need these: esbuild downloads its binary, lefthook syncs git hooks
  esbuild: true
  lefthook: true

catalogs:
  peers:
    typescript: ^5.4.0 || ^6.0.0
  dev:
    "@jridgewell/trace-mapping": ^0.3.31
    "@logtape/lint": 2.4.2
    "@logtape/testing": 2.4.2
    "@tsrx/oxc": 0.21.0
    "@types/node": 24.19.2
    "@types/stack-utils": ^2.0.3
    stack-utils: ^2.0.6
    typescript: ^7.0.2
    typescript5: npm:typescript@^5.9.3
    typescript6: npm:typescript@^6.0.3
    vitest: ^5.0.4
    "@vitest/coverage-v8": ^5.0.4
  examples:
    "@angular/build": ^22.2.2
    "@angular/cli": ^22.2.2
    "@angular/common": ^22.2.3
    "@angular/compiler": ^22.2.3
    "@angular/compiler-cli": ^22.2.3
    "@angular/core": ^22.2.3
    "@angular/platform-browser": ^22.2.3
    "@angular/router": ^22.2.3
    "@preact/preset-vite": ^2.10.6
    "@solidjs/testing-library": ^0.8.10
    "@sveltejs/vite-plugin-svelte": ^7.3.1
    "@testing-library/angular": ^19.5.0
    "@testing-library/dom": ^10.4.2
    "@testing-library/jest-dom": ^7.0.1
    "@testing-library/preact": ^3.2.4
    "@testing-library/react": ^16.3.3
    "@testing-library/svelte": ^5.4.2
    "@testing-library/user-event": ^14.6.8
    "@testing-library/vue": ^8.1.0
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    "@vitejs/plugin-react": ^6.1.2
    "@vitejs/plugin-vue": ^6.0.10
    happy-dom: 21.0.3
    lit: ^3.3.3
    octane: ^0.13.6
    preact: ^11.0.0
    react: ^19.3.1
    react-dom: ^19.3.1
    rxjs: ^7.8.2
