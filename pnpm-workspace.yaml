packages:
  - "packages/*"
  - "examples/*"

allowBuilds:
  # no-op/warning-only postinstall scripts, nothing to build
  core-js-pure: false
  dtrace-provider: false
  protobufjs: false
  # optional native regex binding for renovate; falls back to RegExp fine
  re2: false
  # actually need these: esbuild downloads its binary, lefthook syncs git hooks
  esbuild: true
  lefthook: true

catalogs:
  dev:
    "@types/node": 24.19.1
    typescript: ^7.0.2
    vitest: ^5.0.0
  prod: {}
  peer: {}

minimumReleaseAge: 4320 # 3 days
