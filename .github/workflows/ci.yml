name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CI: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run validate:renovate
      - run: pnpm run lint
      - run: pnpm run sherif
      - run: pnpm run knip
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run test:packages
      - run: pnpm run test:examples
        env:
          CI: true
      - run: pnpm run bench
      - run: pnpm run publint
      - run: pnpm --filter @ddtds/core --filter ddtds --filter @ddtds/vitest publish --dry-run --no-git-checks

  vitest-compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        vitest-version: [4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm add -D vitest@${{ matrix.vitest-version }} --filter @ddtds/vitest --lockfile=false
      - run: pnpm --filter @ddtds/vitest test
