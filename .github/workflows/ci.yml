name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CI: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: pnpm run build
      - run: pnpm run validate:renovate
      - run: pnpm run lint
      - run: pnpm run sherif
      - run: pnpm run knip
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run publint
      - run: pnpm --filter @ddtds/core --filter @ddtds/vitest --filter @ddtds/node-test publish --dry-run --no-git-checks

  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: vitest 4, script: test:vitest, vitest-version: 4 }
          - { name: vitest 5, script: test:vitest, vitest-version: 5 }
          - { name: typecheck TS 5, script: test:typecheck:ci, typescript: 5 }
          - { name: typecheck TS 6, script: test:typecheck:ci, typescript: 6 }
          - { name: node:test 24, script: test:node, node-version: 24 }
          - { name: node:test 25, script: test:node, node-version: 25 }
          - { name: node:test 26, script: test:node, node-version: 26 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      - if: matrix.vitest-version
        run: |
          sed -i -E "s/^(    (vitest|\"@vitest\/coverage-v8\")): .*/\1: ^${VITEST_VERSION}/" pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile
        env:
          VITEST_VERSION: ${{ matrix.vitest-version }}
      - run: pnpm run build
      - run: pnpm run ${{ matrix.script }}
        env:
          TYPESCRIPT: ${{ matrix.typescript }}
